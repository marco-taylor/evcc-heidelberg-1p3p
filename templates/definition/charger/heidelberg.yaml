template: heidelberg
products:
  - brand: Heidelberg
    description:
      generic: Energy Control
  - brand: SENEC
    description:
      generic: Wallbox pro s
  - brand: Walther Werke
    description:
      generic: Basic Evo Pro
  - brand: Amperfied
    description:
      generic: Wallbox Energy Control
capabilities: ["mA", "meter", "dim"]
requirements:
  description:
    de: Bitte das Handbuch zur Verkabelung und Konfiguration genau lesen. Alle Boxen müssen für die externe Steuerung auf Follower-Modus konfiguriert sein (DIP S5/4 OFF). Jede Box braucht eine individuelle Modbus-ID (DIP S4). Auf korrekte RS485-Verkabelung inkl. Busterminierung (DIP S6/2) achten.
    en: Please read the wiring and configuration manual carefully. All boxes must be configured for external control in follower mode (DIP S5/4 OFF). Each box needs an individual Modbus ID (DIP S4). Ensure correct RS485 cabling including bus termination (DIP S6/2).
  evcc: ["sponsorship"]
params:
  - name: modbus
    choice: ["rs485", "tcpip"]
    id: 1
    baudrate: 19200
    comset: 8E1
  - name: phasefeedback
    type: bool
    default: false
    advanced: true
    description:
      de: Bestätigte Phasenrückmeldung der Safety-Firmware
      en: Confirmed phase feedback from safety firmware
    help:
      de: Nur für Heidelberg-1P3P v1.2.0-safety.1 mit bestätigter Register-4-Rückmeldung aktivieren. Alte Brücken melden dort nur einen Auftrag.
      en: Enable only for Heidelberg-1P3P v1.2.0-safety.1 with confirmed register 4 feedback. Older bridges only report a request.
render: |
  type: heidelberg
  {{- include "modbus" . }}
  {{- if .phasefeedback }}
  phasefeedback: true
  {{- end }}
